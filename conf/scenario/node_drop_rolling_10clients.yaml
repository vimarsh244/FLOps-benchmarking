# rolling node drop scenario for 10 clients
# simulates 10-20% clients offline at any time with rolling pattern
name: node_drop
_target_: src.scenarios.node_drop.NodeDropScenario

enabled: true

# rolling drop pattern: ~2 clients offline at any time
# wave 1: clients 0,1 drop at round 20, rejoin at round 48
# wave 2: clients 2,3 drop at round 40, rejoin at round 72
# wave 3: clients 4,5 drop at round 60, rejoin at round 92
# wave 4: clients 6,7 drop at round 80, rejoin at round 112
# wave 5: clients 8,9 drop at round 100, rejoin at round 132
# wave 6: back to 0,1 at round 120, rejoin at round 152
# wave 7: clients 2,3 drop at round 140, rejoin at round 172
# wave 8: clients 4,5 drop at round 160, rejoin at round 192
drop_events:
  # wave 1
  - client_ids: [0, 1]
    disconnect_round: 20
    rejoin_round: 48
  # wave 2
  - client_ids: [2, 3]
    disconnect_round: 40
    rejoin_round: 72
  # wave 3
  - client_ids: [4, 5]
    disconnect_round: 60
    rejoin_round: 92
  # wave 4
  - client_ids: [6, 7]
    disconnect_round: 80
    rejoin_round: 112
  # wave 5
  - client_ids: [8, 9]
    disconnect_round: 100
    rejoin_round: 132
  # wave 6 - cycle back
  - client_ids: [0, 1]
    disconnect_round: 120
    rejoin_round: 152
  # wave 7
  - client_ids: [2, 3]
    disconnect_round: 140
    rejoin_round: 172
  # wave 8
  - client_ids: [4, 5]
    disconnect_round: 160
    rejoin_round: 192

auto_mode:
  enabled: false

