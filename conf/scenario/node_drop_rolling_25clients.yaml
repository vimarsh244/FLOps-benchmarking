# rolling node drop scenario for 25 clients (tinyimagenet)
# simulates ~20-28% clients offline at any time (5-7 clients)
name: node_drop
_target_: src.scenarios.node_drop.NodeDropScenario

enabled: true

# rolling drop pattern: ~5-7 clients offline at any time (20-28%)
# more aggressive to match user requirement of "at least 7 dropped clients"
# wave 1: clients 0,1,2,3 drop at round 20, rejoin at round 56
# wave 2: clients 4,5,6,7 drop at round 40, rejoin at round 76
# wave 3: clients 8,9,10,11 drop at round 60, rejoin at round 96
# wave 4: clients 12,13,14 drop at round 80, rejoin at round 116
# wave 5: clients 15,16,17 drop at round 100, rejoin at round 136
# wave 6: clients 18,19,20 drop at round 120, rejoin at round 156
# wave 7: clients 21,22,23 drop at round 140, rejoin at round 176
# wave 8: clients 24,0,1 drop at round 160, rejoin at round 196
drop_events:
  # wave 1 (4 clients)
  - client_ids: [0, 1, 2, 3]
    disconnect_round: 20
    rejoin_round: 56
  # wave 2 (4 clients, now 7 total offline from rounds 40-55)
  - client_ids: [4, 5, 6, 7]
    disconnect_round: 40
    rejoin_round: 76
  # wave 3
  - client_ids: [8, 9, 10, 11]
    disconnect_round: 60
    rejoin_round: 96
  # wave 4
  - client_ids: [12, 13, 14]
    disconnect_round: 80
    rejoin_round: 116
  # wave 5
  - client_ids: [15, 16, 17]
    disconnect_round: 100
    rejoin_round: 136
  # wave 6
  - client_ids: [18, 19, 20]
    disconnect_round: 120
    rejoin_round: 156
  # wave 7
  - client_ids: [21, 22, 23]
    disconnect_round: 140
    rejoin_round: 176
  # wave 8
  - client_ids: [24, 0, 1]
    disconnect_round: 160
    rejoin_round: 196

auto_mode:
  enabled: false

