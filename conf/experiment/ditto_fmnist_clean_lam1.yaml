# @package _global_
# Ditto Fashion MNIST Reproduction - lambda=1, clean data

defaults:
  - override /dataset: fmnist
  - override /model: ditto_cnn
  - override /strategy: ditto
  - override /partitioner: pathological
  - override /scenario: baseline
  - override /logging: wandb

experiment:
  name: ditto_fmnist_reproduction_lam1
  seed: 0

server:
  num_rounds: 500
  fraction_fit: 0.02           # 10 out of 500 clients per round
  fraction_evaluate: 1.0       # evaluate all clients
  min_fit_clients: 10
  min_evaluate_clients: 10
  min_available_clients: 500
  accept_failures: true

client:
  num_clients: 500
  local_epochs: 1              # unused when local_iters > 0
  local_iters: 2               # 2 SGD steps per round - paper setting
  batch_size: 16
  learning_rate: 0.05
  optimizer: sgd
  momentum: 0.0
  weight_decay: 0.0

strategy:
  ditto_mu: 1.0
  personal_epochs: null
  evaluate_personalized: true
  local_iters: 2

partitioner:
  num_classes_per_partition: 5  # 5 classes per client - paper setting

training:
  device: auto

evaluation:
  test_fraction: 0.2
